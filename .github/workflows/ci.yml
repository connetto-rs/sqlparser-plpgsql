name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Test, lint and document
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --release --all-features

      # Requirement D. The suite runs against the crate built without its std
      # feature, and the crate is built for a target where std does not exist
      # at all, so an accidental dependency on it cannot compile.
      - name: Test without std
        run: cargo test --release --no-default-features --features body-parse

      - name: Build for a target without std
        run: |
          rustup target add thumbv7em-none-eabihf
          cargo build --no-default-features --features body-parse \
            --target thumbv7em-none-eabihf

      - name: Document
        run: cargo doc --no-deps

  fuzz-corpus:
    name: Fuzz corpus regression
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install nightly
        run: rustup toolchain install nightly --profile minimal

      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-fuzz

      # -runs=0 executes every stored input once and exits. Fuzzing for a fixed
      # time instead would let an unrelated new find turn a pull request red.
      # The target is pinned because a musl-built cargo-fuzz otherwise defaults
      # to musl, whose static libc cannot link the sanitizer.
      - name: Replay corpora
        run: |
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu \
            fuzz_scanner_regions fuzz/corpus/fuzz_scanner_regions/ -- -runs=0
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu \
            fuzz_preprocessor_preprocess fuzz/corpus/fuzz_preprocessor_preprocess/ -- -runs=0
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu \
            fuzz_parse_body fuzz/corpus/fuzz_parse_body/ -- -runs=0

  coverage:
    name: Coverage
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Must track `rust-version` in Cargo.toml. A floor nothing builds against
      # is a claim, not a guarantee.
      - name: Install the declared floor
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"

      - name: Test
        run: cargo test --all-targets --all-features

      - name: Test without std
        run: cargo test --all-targets --no-default-features --features body-parse
